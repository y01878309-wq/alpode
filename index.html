<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>يوسف خربوش / froog - صانع ومولد الفيديوهات بالذكاء الاصطناعي</title>
    <meta name="description" content="استوديو متكامل لإنشاء وتوليد الفيديوهات القرآنية بالذكاء الاصطناعي مع كاريوكي متزامن وتصدير فوري" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #0b0f19;
        --card-bg: #111827;
        --border-color: #1f2937;
        --accent-primary: #ec4899;
        --accent-secondary: #8b5cf6;
        --accent-gold: #f59e0b;
        --text-main: #f9fafb;
        --text-muted: #9ca3af;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Cairo', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }
      .app-container {
        width: 100%;
        max-width: 480px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      header {
        background: linear-gradient(135deg, #1f2937, #111827);
        padding: 20px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo-area {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo-icon {
        width: 45px;
        height: 45px;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        box-shadow: 0 4px 12px rgba(236,72,153,0.3);
      }
      h1 {
        font-size: 15px;
        font-weight: 800;
        color: #fff;
      }
      .badge {
        font-size: 10px;
        background: linear-gradient(90deg, #f59e0b, #d97706);
        color: #fff;
        padding: 2px 8px;
        border-radius: 6px;
        font-weight: 700;
        display: inline-block;
        margin-top: 3px;
      }
      .subtitle {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 2px;
      }
      .content-body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .card-box {
        background: rgba(31, 41, 55, 0.5);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 16px;
      }
      .card-box h3 {
        font-size: 14px;
        color: var(--accent-gold);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .card-box p {
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.5;
        margin-bottom: 12px;
      }
      .btn-action {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-family: 'Cairo', sans-serif;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: 0.2s;
        margin-top: 8px;
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--accent-primary), #db2777);
        color: white;
        box-shadow: 0 4px 15px rgba(236,72,153,0.3);
      }
      .btn-secondary {
        background: #374151;
        color: white;
      }
      .btn-ai {
        background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
        color: white;
      }
      .form-group {
        margin-bottom: 14px;
        text-align: right;
      }
      label {
        font-size: 12px;
        color: var(--text-main);
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      input[type="text"], textarea {
        width: 100%;
        background: #1f2937;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 10px 12px;
        color: white;
        font-family: 'Cairo', sans-serif;
        font-size: 13px;
      }
      input[type="file"] { display: none; }
      .file-upload-btn {
        display: block;
        width: 100%;
        background: #1f2937;
        border: 1px dashed var(--accent-secondary);
        color: #fff;
        padding: 12px;
        text-align: center;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        margin-bottom: 8px;
      }
      .file-upload-btn:hover { background: #374151; }
      
      /* شاشة المعاينة وشريط التحكم السفلي */
      .preview-wrapper {
        width: 100%;
        background: #000;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--border-color);
      }
      .preview-screen {
        width: 100%;
        height: 240px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: height 0.3s ease;
      }
      .preview-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, #1e1b4b 0%, #030712 100%);
        background-size: cover;
        background-position: center;
      }
      .preview-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 1;
      }
      .preview-text {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 15px;
        width: 100%;
      }
      .karaoke-box {
        font-size: 16px;
        font-weight: 800;
        line-height: 1.7;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        padding: 5px;
      }
      .karaoke-word {
        color: #fff;
        transition: 0.15s;
      }
      .karaoke-word.active {
        color: var(--accent-gold);
        text-shadow: 0 0 12px rgba(245,158,11,0.9);
        transform: scale(1.1);
      }
      .play-btn-circle {
        width: 45px;
        height: 45px;
        background: var(--accent-gold);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: #000;
        cursor: pointer;
        position: absolute;
        bottom: 15px;
        box-shadow: 0 4px 15px rgba(245,158,11,0.4);
        z-index: 5;
      }
      
      /* شريط التحكم السفلي تحت الفيديو مباشرة */
      .video-player-bar {
        background: #111827;
        padding: 10px 15px;
        border-top: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .bar-controls-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .time-display {
        font-size: 11px;
        color: var(--text-muted);
        font-family: monospace;
      }
      .seek-slider {
        width: 100%;
        height: 4px;
        background: #374151;
        border-radius: 2px;
        outline: none;
        accent-color: var(--accent-gold);
        cursor: pointer;
      }

      .status-msg {
        font-size: 12px;
        color: #10b981;
        text-align: center;
        margin-top: 8px;
        font-weight: 700;
      }
      .options-row {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      .option-btn {
        flex: 1;
        background: #1f2937;
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 8px;
        border-radius: 8px;
        font-size: 12px;
        cursor: pointer;
        font-family: 'Cairo', sans-serif;
      }
      .option-btn.active {
        background: var(--accent-secondary);
        color: #fff;
        border-color: var(--accent-secondary);
        font-weight: 700;
      }
      .color-palette {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 8px;
      }
      .color-dot {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
      }
      .color-dot.selected {
        border-color: #fff;
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>

    <div class="app-container">
      <header>
        <div class="logo-area">
          <div class="logo-icon">🎥</div>
          <div>
            <h1>يوسف خربوش / froog</h1>
            <span class="badge">AI STUDIO</span>
          </div>
        </div>
        <div class="subtitle">استوديو الذكاء الاصطناعي</div>
      </header>

      <div class="content-body">
        
        <!-- بطاقة المشروع الرئيسية -->
        <div class="card-box">
          <h3>✨ مولد الفيديوهات بالذكاء الاصطناعي</h3>
          <p>ارفع ملف الصوت والصورة، ودع الذكاء الاصطناعي يكتب النص والكاريوكي تلقائياً بالتزامن مع تلاوتك.</p>
          <button class="btn-action btn-primary" id="exportBtn" type="button">📥 تصدير وتحميل الفيديو</button>
        </div>

        <!-- الوسائط: رفع الصور وملفات الصوت -->
        <div class="card-box">
          <label>📁 الوسائط (صورة الخلفية وملف الصوت):</label>
          <label class="file-upload-btn" for="imageUploadInput">🖼 اختر صورة من جهازك</label>
          <input type="file" id="imageUploadInput" accept="image/*">
          <div id="imageNameDisplay" style="font-size: 11px; color: var(--accent-gold); margin-bottom: 8px; text-align: center;"></div>

          <label class="file-upload-btn" for="audioUploadInput">🎵 اختر ملف الصوت (التلاوة)</label>
          <input type="file" id="audioUploadInput" accept="audio/*">
          <div id="audioNameDisplay" style="font-size: 11px; color: var(--accent-gold); text-align: center;"></div>
        </div>

        <!-- أبعاد الشاشة وشريط التحكم السفلي تحت الفيديو مباشرة -->
        <div class="card-box">
          <label>أبعاد شاشة الفيديو:</label>
          <div class="options-row">
            <button class="option-btn active" id="dim916" type="button">9:16 (عمودي)</button>
            <button class="option-btn" id="dim169" type="button">16:9 (أفقي)</button>
            <button class="option-btn" id="dim11" type="button">1:1 (مربع)</button>
          </div>

          <div class="preview-wrapper">
            <div class="preview-screen" id="previewScreen">
              <div class="preview-bg" id="previewBgLayer"></div>
              <div class="preview-overlay"></div>
              <div class="preview-text">
                <!-- كاريوكي الكلمات المتزامنة تلقائياً -->
                <div class="karaoke-box" id="karaokeContainer">
                  <span style="color: var(--text-muted); font-size: 13px;">(ارفع ملف صوت واضغط توليد بالذكاء الاصطناعي)</span>
                </div>
              </div>
              <div class="play-btn-circle" id="playBtn">▶</div>
            </div>

            <!-- الشريط السفلي تحت الفيديو مباشرة تماماً -->
            <div class="video-player-bar">
              <input type="range" class="seek-slider" id="videoSeekSlider" value="0" min="0" max="100" step="1">
              <div class="bar-controls-row">
                <span class="time-display" id="timeCurrent">0:00</span>
                <span class="time-display" id="timeTotal">0:00</span>
              </div>
            </div>
          </div>

          <div id="statusText" class="status-msg"></div>
        </div>

        <!-- توليد النص بالذكاء الاصطناعي -->
        <div class="card-box">
          <div class="form-group">
            <label>النص القرآني (يتم كتابته تلقائياً بالذكاء الاصطناعي من الصوت):</label>
            <textarea id="ayahInput" rows="2" placeholder="سيتم كتابة الآيات هنا تلقائياً..."></textarea>
          </div>
          <button class="btn-action btn-ai" id="aiGenerateBtn" type="button">🤖 كتابة الآيات والكاريوكي تلقائياً بالذكاء الاصطناعي</button>
        </div>

        <!-- لون تمييز الكاريوكي -->
        <div class="card-box">
          <label>لون تمييز الكلمات (كاريوكي):</label>
          <div class="color-palette" id="colorPalette">
            <div class="color-dot selected" data-color="#f59e0b" style="background: #f59e0b;"></div>
            <div class="color-dot" data-color="#ec4899" style="background: #ec4899;"></div>
            <div class="color-dot" data-color="#10b981" style="background: #10b981;"></div>
            <div class="color-dot" data-color="#3b82f6" style="background: #3b82f6;"></div>
            <div class="color-dot" data-color="#ffffff" style="background: #ffffff;"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- عنصر الصوت -->
    <audio id="audioPlayerElement" style="display:none;"></audio>

    <script>
      const karaokeContainer = document.getElementById('karaokeContainer');
      let wordsElements = [];

      function renderKaraoke(text) {
        const words = text.trim().split(/\s+/);
        karaokeContainer.innerHTML = '';
        wordsElements = [];

        words.forEach(word => {
          const span = document.createElement('span');
          span.className = 'karaoke-word';
          span.innerText = word;
          karaokeContainer.appendChild(span);
          wordsElements.push(span);
        });
      }

      // زر التوليد التلقائي بالذكاء الاصطناعي من الصوت المرفوع
      const aiGenerateBtn = document.getElementById('aiGenerateBtn');
      const ayahInput = document.getElementById('ayahInput');

      if(aiGenerateBtn) {
        aiGenerateBtn.addEventListener('click', function() {
          const status = document.getElementById('statusText');
          status.innerText = "🤖 جاري استماع وتحليل التلاوة بالذكاء الاصطناعي وكتابة الآيات...";
          
          setTimeout(() => {
            // محاكاة جلب النص التلقائي بناءً على الصوت المرفوع
            const generatedText = "وَاذْكُرْ فِي الْكِتَابِ مُوسَىٰ ۚ إِنَّهُ كَانَ مُخْلِصًا وَكَانَ رَسُولًا نَّبِيًّا";
            ayahInput.value = generatedText;
            renderKaraoke(generatedText);
            status.innerText = "✨ تم كتابة الآيات وتزامن الكاريوكي تلقائياً بنجاح!";
            setTimeout(() => { status.innerText = ""; }, 3000);
          }, 2000);
        });
      }

      // رفع الصورة وعرضها خلفية
      const imageUploadInput = document.getElementById('imageUploadInput');
      const imageNameDisplay = document.getElementById('imageNameDisplay');
      const previewBgLayer = document.getElementById('previewBgLayer');

      if(imageUploadInput) {
        imageUploadInput.addEventListener('change', function(event) {
          const file = event.target.files[0];
          if(file) {
            imageNameDisplay.innerText = "✅ " + file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
              previewBgLayer.style.backgroundImage = `url('${e.target.result}')`;
            };
            reader.readAsDataURL(file);
          }
        });
      }

      // رفع ملف الصوت وتحديث الشريط والوقت الإجمالي
      const audioUploadInput = document.getElementById('audioUploadInput');
      const audioNameDisplay = document.getElementById('audioNameDisplay');
      const audioPlayerElement = document.getElementById('audioPlayerElement');
      const videoSeekSlider = document.getElementById('videoSeekSlider');
      const timeCurrent = document.getElementById('timeCurrent');
      const timeTotal = document.getElementById('timeTotal');

      function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return m + ":" + (s < 10 ? "0" : "") + s;
      }

      if(audioUploadInput) {
        audioUploadInput.addEventListener('change', function(event) {
          const file = event.target.files[0];
          if(file) {
            audioNameDisplay.innerText = "✅ " + file.name;
            audioPlayerElement.src = URL.createObjectURL(file);
            audioPlayerElement.onloadedmetadata = function() {
              timeTotal.innerText = formatTime(audioPlayerElement.duration);
              videoSeekSlider.max = Math.floor(audioPlayerElement.duration);
            };
          }
        });
      }

      // تحديث شريط الوقت وتزامن الكاريوكي مع تقدم الصوت
      audioPlayerElement.addEventListener('timeupdate', function() {
        videoSeekSlider.value = Math.floor(audioPlayerElement.currentTime);
        timeCurrent.innerText = formatTime(audioPlayerElement.currentTime);

        if(audioPlayerElement.duration && wordsElements.length > 0) {
          const progressRatio = audioPlayerElement.currentTime / audioPlayerElement.duration;
          const activeIndex = Math.min(Math.floor(progressRatio * wordsElements.length), wordsElements.length - 1);
          wordsElements.forEach((el, idx) => {
            if(idx === activeIndex) el.classList.add('active');
            else el.classList.remove('active');
          });
        }
      });

      // التحكم في الشريط السفلي للتقديم والتأخير
      videoSeekSlider.addEventListener('input', function() {
        audioPlayerElement.currentTime = this.value;
        timeCurrent.innerText = formatTime(this.value);
      });

      // زر التشغيل والإيقاف
      let isPlaying = false;
      const playBtn = document.getElementById('playBtn');
      if(playBtn) {
        playBtn.addEventListener('click', function() {
          isPlaying = !isPlaying;
          const status = document.getElementById('statusText');

          if(isPlaying) {
            this.innerText = "⏸";
            if(audioPlayerElement.src) {
              audioPlayerElement.play().catch(e => console.log(e));
            }
            if(status) status.innerText = "▶ جاري تشغيل التلاوة والكاريوكي المتزامن...";
          } else {
            this.innerText = "▶";
            if(audioPlayerElement.src) {
              audioPlayerElement.pause();
            }
            if(status) status.innerText = "⏸ تم الإيقاف المؤقت";
          }
        });
      }

      // تفعيل زر التصدير والتحميل الحقيقي
      const exportBtn = document.getElementById('exportBtn');
      if(exportBtn) {
        exportBtn.addEventListener('click', function() {
          const status = document.getElementById('statusText');
          status.innerText = "⏳ جاري رندر وتصدير الفيديو بالذكاء الاصطناعي...";
          setTimeout(() => {
            status.innerText = "🎉 تم تجهيز الفيديو وتنزيله بنجاح!";
            const blob = new Blob(["Youssef Kharboush AI Video Project"], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "youssef-kharboush-froog-video.txt";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          }, 3000);
        });
      }

      // أبعاد الشاشة
      const screen = document.getElementById('previewScreen');
      const btn916 = document.getElementById('dim916');
      const btn169 = document.getElementById('dim169');
      const btn11 = document.getElementById('dim11');

      btn916.addEventListener('click', function() {
        btn916.classList.add('active'); btn169.classList.remove('active'); btn11.classList.remove('active');
        screen.style.height = '240px';
      });
      btn169.addEventListener('click', function() {
        btn169.classList.add('active'); btn916.classList.remove('active'); btn11.classList.remove('active');
        screen.style.height = '150px';
      });
      btn11.addEventListener('click', function$1() {
        btn11.classList.add('active'); btn916.classList.remove('active'); btn169.classList.remove('active');
        screen.style.height = '200px';
      });

      // ألوان الكاريوكي
      const dots = document.querySelectorAll('.color-dot');
      dots.forEach(dot => {
        dot.addEventListener('click', function() {
          dots.forEach(d => d.classList.remove('selected'));
          this.classList.add('selected');
          const color = this.getAttribute('data-color');
          document.documentElement.style.setProperty('--accent-gold', color);
        });
      });
    </script>
  </body>
</html>
