<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>يوسف خربوش / froog - صانع ومولد الفيديوهات بالذكاء الاصطناعي</title>
    <meta name="description" content="استوديو متكامل لإنشاء وتوليد الفيديوهات القرآنية بالذكاء الاصطناعي مع كاريوكي متزامن وتصدير فوري" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #0b0f19;
        --card-bg: #111827;
        --border-color: #1f2937;
        --accent-primary: #ec4899;
        --accent-secondary: #8b5cf6;
        --accent-gold: #f59e0b;
        --text-main: #f9fafb;
        --text-muted: #9ca3af;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Cairo', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }
      .app-container {
        width: 100%;
        max-width: 480px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      header {
        background: linear-gradient(135deg, #1f2937, #111827);
        padding: 20px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo-area {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo-icon {
        width: 45px;
        height: 45px;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        box-shadow: 0 4px 12px rgba(236,72,153,0.3);
      }
      h1 {
        font-size: 15px;
        font-weight: 800;
        color: #fff;
      }
      .badge {
        font-size: 10px;
        background: linear-gradient(90deg, #f59e0b, #d97706);
        color: #fff;
        padding: 2px 8px;
        border-radius: 6px;
        font-weight: 700;
        display: inline-block;
        margin-top: 3px;
      }
      .subtitle {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 2px;
      }
      .content-body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .card-box {
        background: rgba(31, 41, 55, 0.5);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 16px;
      }
      .card-box h3 {
        font-size: 14px;
        color: var(--accent-gold);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .card-box p {
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.5;
        margin-bottom: 12px;
      }
      .btn-action {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-family: 'Cairo', sans-serif;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: 0.2s;
        margin-top: 8px;
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--accent-primary), #db2777);
        color: white;
        box-shadow: 0 4px 15px rgba(236,72,153,0.3);
      }
      .btn-secondary {
        background: #374151;
        color: white;
      }
      .form-group {
        margin-bottom: 14px;
        text-align: right;
      }
      label {
        font-size: 12px;
        color: var(--text-main);
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      input[type="text"], textarea {
        width: 100%;
        background: #1f2937;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 10px 12px;
        color: white;
        font-family: 'Cairo', sans-serif;
        font-size: 13px;
      }
      input[type="file"] { display: none; }
      .file-upload-btn {
        display: block;
        width: 100%;
        background: #1f2937;
        border: 1px dashed var(--accent-secondary);
        color: #fff;
        padding: 12px;
        text-align: center;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        margin-bottom: 8px;
      }
      .file-upload-btn:hover { background: #374151; }
      
      /* شاشة المعاينة وشريط التحكم السفلي */
      .preview-wrapper {
        width: 100%;
        background: #000;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--border-color);
      }
      .preview-screen {
        width: 100%;
        height: 240px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: height 0.3s ease;
      }
      .preview-bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, #1e1b4b 0%, #030712 100%);
        background-size: cover;
        background-position: center;
      }
      .preview-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 1;
      }
      .preview-text {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 15px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .preview-sheikh-badge {
        font-size: 10px;
        background: rgba(31, 41, 55, 0.85);
        border: 1px solid var(--border-color);
        color: var(--accent-gold);
        padding: 3px 10px;
        border-radius: 20px;
        font-weight: 700;
      }
      .karaoke-box {
        font-size: 16px;
        font-weight: 800;
        line-height: 1.7;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        padding: 5px;
      }
      .karaoke-word {
        color: #fff;
        transition: 0.15s;
      }
      .karaoke-word.active {
        color: var(--accent-gold);
        text-shadow: 0 0 12px rgba(245,158,11,0.9);
        transform: scale(1.1);
      }
      .play-btn-circle {
        width: 45px;
        height: 45px;
        background: var(--accent-gold);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: #000;
        cursor: pointer;
        position: absolute;
        bottom: 15px;
        box-shadow: 0 4px 15px rgba(245,158,11,0.4);
        z-index: 5;
      }
      
      /* شريط التحكم السفلي تحت الفيديو مباشرة */
      .video-player-bar {
        background: #111827;
        padding: 10px 15px;
        border-top: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .bar-controls-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .time-display {
        font-size: 11px;
        color: var(--text-muted);
        font-family: monospace;
      }
      .seek-slider {
        width: 100%;
        height: 4px;
        background: #374151;
        border-radius: 2px;
        outline: none;
        accent-color: var(--accent-gold);
        cursor: pointer;
      }

      .status-msg {
        font-size: 12px;
        color: #10b981;
        text-align: center;
        margin-top: 8px;
        font-weight: 700;
      }
      .options-row {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      .option-btn {
        flex: 1;
        background: #1f2937;
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 8px;
        border-radius: 8px;
        font-size: 12px;
        cursor: pointer;
        font-family: 'Cairo', sans-serif;
      }
      .option-btn.active {
        background: var(--accent-secondary);
        color: #fff;
        border-color: var(--accent-secondary);
        font-weight: 700;
      }
      .color-palette {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 8px;
      }
      .color-dot {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
      }
      .color-dot.selected {
        border-color: #fff;
        transform: scale(1.1);
      }
    </style>
  </head>

        <div class="card-box">
