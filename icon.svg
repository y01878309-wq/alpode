<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#iconGrad)" stroke-width="8" stroke-dasharray="24 16" opacity="0.6"/>
  
  <!-- Main Video Icon Backdrop -->
  <rect x="136" y="156" width="240" height="200" rx="40" fill="url(#iconGrad)" filter="url(#glow)"/>
  
  <!-- Inner Play Symbol -->
  <polygon points="230,210 310,256 230,302" fill="#ffffff"/>
  
  <!-- Subtle sparkles -->
  <circle cx="360" cy="140" r="14" fill="#fbbf24"/>
  <circle cx="150" cy="370" r="10" fill="#38bdf8"/>
</svg>
